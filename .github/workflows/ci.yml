name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # setup-all skips each CLI when its version input is empty. Pin the same
      # versions used by this repository so program builds are reproducible.
      - uses: solana-foundation/github-actions/setup-all@v0.2.15
        with:
          solana_version: "3.1.10"
          anchor_version: "1.1.2"
      - name: Verify program build tools
        run: |
          solana --version
          anchor --version
      - run: npm ci
      - run: npm run anchor-build
      - run: npm run codama:js
      - name: Generated client is current
        run: git diff --exit-code -- app/generated/wildquest
      - run: cargo test -p wildquest --test test_initialize
