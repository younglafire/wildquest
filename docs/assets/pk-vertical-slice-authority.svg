<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title description">
  <title id="title">WildQuest vertical slice authority and account map</title>
  <desc id="description">Supabase and the Next.js server authorize a capture. Two wallets sign instructions handled by one Solana program. Program-derived accounts store configuration, creatures, and matches.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1e7a3c"/>
    </marker>
    <style>
      .title{font:700 22px Arial,sans-serif;fill:#111}.label{font:700 14px Arial,sans-serif;fill:#111}.body{font:12px Arial,sans-serif;fill:#222}.small{font:italic 11px Arial,sans-serif;fill:#555}.mono{font:11px Menlo,monospace;fill:#222}.account{fill:#fff;stroke:#111;stroke-width:1.5}.offchain{fill:#f4f4f2;stroke:#555;stroke-width:1.2}.rule{stroke:#888;stroke-width:.8}.flow{fill:none;stroke:#1e7a3c;stroke-width:2;marker-end:url(#arrow)}.authority{fill:none;stroke:#555;stroke-width:1.3;stroke-dasharray:5 4}.curve{fill:none;stroke:#111;stroke-width:3.5}.dot{fill:#111}.accent{font:700 12px Arial,sans-serif;fill:#1e7a3c}.halo{paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
    </style>
  </defs>

  <text x="1060" y="34" text-anchor="end" class="title">WildQuest authority map</text>
  <text x="1060" y="55" text-anchor="end" class="small">Devnet program 3WwK…a641 · balance v1 · rules v1</text>

  <rect x="38" y="32" width="270" height="112" class="offchain"/>
  <text x="54" y="58" class="label">Supabase catalogue</text>
  <line x1="54" y1="66" x2="292" y2="66" class="rule"/>
  <text x="54" y="84" class="body">IDs 1001–1006 · names · images</text>
  <text x="54" y="102" class="body">model_class_id · active · source</text>
  <text x="54" y="124" class="small">Offchain content and duplicate reservation</text>

  <rect x="348" y="32" width="286" height="112" class="offchain"/>
  <text x="364" y="58" class="label">Next.js capture server</text>
  <line x1="364" y1="66" x2="618" y2="66" class="rule"/>
  <text x="364" y="84" class="body">local ResNet · proof hash · strict schema</text>
  <text x="364" y="102" class="body">capture-authority signature</text>
  <text x="364" y="124" class="small">Never sends authority private key to browser</text>

  <path d="M 0,180 Q 650,180 1100,300" class="curve"/>
  <text x="1060" y="88" text-anchor="end" class="label halo">Solana Devnet</text>

  <circle cx="180" cy="184" r="5" class="dot"/>
  <text x="180" y="169" text-anchor="middle" class="small halo">Wallet A public key</text>
  <rect x="38" y="204" width="270" height="94" rx="6" class="account"/>
  <text x="54" y="230" class="label">Wallet A</text>
  <line x1="54" y1="238" x2="292" y2="238" class="rule"/>
  <text x="54" y="257" class="body">signs capture_creature() and open_match()</text>
  <text x="54" y="277" class="body">chooses three owned Creature accounts</text>

  <circle cx="464" cy="195" r="5" class="dot"/>
  <text x="464" y="178" text-anchor="middle" class="small halo">Wallet B public key</text>
  <rect x="348" y="216" width="286" height="82" rx="6" class="account"/>
  <text x="364" y="242" class="label">Wallet B</text>
  <line x1="364" y1="250" x2="618" y2="250" class="rule"/>
  <text x="364" y="270" class="body">signs join_match() with three owned Creatures</text>

  <circle cx="864" cy="250" r="5" class="dot"/>
  <text x="864" y="231" text-anchor="middle" class="small halo">Program address</text>
  <rect x="716" y="272" width="310" height="138" rx="6" class="account"/>
  <text x="734" y="299" class="label">WildQuest program</text>
  <line x1="734" y1="307" x2="1008" y2="307" class="rule"/>
  <text x="734" y="327" class="mono">initialize_game_config()</text>
  <text x="734" y="346" class="mono">initialize_species_config()</text>
  <text x="734" y="365" class="mono">capture_creature()</text>
  <text x="734" y="384" class="mono">open_match() · join_match() · cancel_match()</text>
  <text x="734" y="402" class="small">Checks ownership, battle rules, and lamports</text>

  <path d="M308,100 C332,100 333,100 348,100" class="flow"/>
  <text x="328" y="88" text-anchor="middle" class="accent halo">catalogue row</text>
  <path d="M634,98 C690,100 690,232 716,328" class="flow"/>
  <text x="682" y="170" text-anchor="middle" class="accent halo">co-signed capture</text>
  <path d="M308,275 C430,330 540,510 716,348" class="flow"/>
  <text x="474" y="469" text-anchor="middle" class="accent halo">owner signature + 0.01 SOL</text>
  <path d="M634,270 C674,290 694,348 716,375" class="flow"/>
  <text x="680" y="315" text-anchor="middle" class="accent halo">join + 0.01 SOL</text>

  <rect x="716" y="452" width="310" height="98" rx="6" class="account"/>
  <text x="734" y="479" class="label">GameConfig account</text>
  <line x1="734" y1="487" x2="1008" y2="487" class="rule"/>
  <text x="734" y="506" class="mono">capture_authority · balance_version</text>
  <text x="734" y="525" class="mono">rules_version · stake_lamports · bump</text>
  <path d="M872,410 L872,452" class="authority"/>
  <text x="886" y="437" class="small halo">config authority</text>

  <rect x="716" y="584" width="310" height="112" rx="6" class="account"/>
  <text x="734" y="611" class="label">SpeciesConfig accounts</text>
  <line x1="734" y1="619" x2="1008" y2="619" class="rule"/>
  <text x="734" y="638" class="mono">catalogue_id · model_class_id · active</text>
  <text x="734" y="657" class="mono">hp · attack · defense · speed · shield</text>
  <text x="734" y="676" class="mono">balance_version · bump</text>
  <path d="M872,550 L872,584" class="authority"/>

  <rect x="38" y="382" width="270" height="128" rx="6" class="account"/>
  <text x="54" y="409" class="label">Creature accounts</text>
  <line x1="54" y1="417" x2="292" y2="417" class="rule"/>
  <text x="54" y="436" class="mono">owner · catalogue_id · proof_hash</text>
  <text x="54" y="455" class="mono">captured_at · balance_version · bump</text>
  <text x="54" y="480" class="small">PDA: creature + owner + catalogue_id_le</text>
  <text x="54" y="498" class="small">One address per wallet and catalogue ID</text>
  <path d="M716,366 C610,366 520,426 308,440" class="authority"/>

  <rect x="348" y="570" width="286" height="190" rx="6" class="account"/>
  <text x="364" y="597" class="label">Match account</text>
  <line x1="364" y1="605" x2="618" y2="605" class="rule"/>
  <text x="364" y="624" class="mono">match_id · creator · opponent</text>
  <text x="364" y="643" class="mono">creator_creatures[3]</text>
  <text x="364" y="662" class="mono">opponent_creatures[3]</text>
  <text x="364" y="681" class="mono">stake_lamports · balance_version</text>
  <text x="364" y="700" class="mono">rules_version · status · winner</text>
  <text x="364" y="719" class="mono">created_at · settled_at · bump</text>
  <text x="364" y="744" class="small">PDA: match + creator + match_id_le</text>
  <path d="M716,390 C650,420 644,572 634,620" class="authority"/>

  <text x="38" y="798" class="small">Rounded boxes are Solana accounts. Square boxes are offchain services. Dashed lines show account authority or program ownership.</text>
</svg>
